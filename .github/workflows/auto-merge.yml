name: Auto Merge

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0]
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Check PR eligibility
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const [pr] = context.payload.workflow_run.pull_requests;
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const labels = data.labels.map((label) => label.name);
            const allowedAuthors = ['github-actions[bot]', 'dependabot[bot]'];
            const eligible =
              labels.includes('dependencies') || allowedAuthors.includes(data.user.login);

            core.setOutput('eligible', eligible ? 'true' : 'false');

      - name: Enable auto-merge
        if: steps.check.outputs.eligible == 'true'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          merge-method: squash
