<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="简洁的 X 关注流，支持长文入口、引用上下文与离线缓存。"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="X-Line" />
    <title>X-Line</title>
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          let theme = 'system';

          if (stored) {
            try {
              // useLocalStorage 使用 JSON.stringify，所以需要解析
              theme = JSON.parse(stored);
            } catch {
              // 如果不是 JSON 格式，直接使用原始值（向后兼容）
              theme = stored;
            }
          }

          let resolvedTheme = theme;
          if (theme === 'system') {
            resolvedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }

          if (resolvedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch {
          // Ignore errors
        }
      })();
    </script>
    <style>
      html {
        color-scheme: light dark;
      }
      html.dark {
        color-scheme: dark;
      }
      body {
        background-color: #ffffff;
        color: #000000;
      }
      html.dark body {
        background-color: #0f0f0f;
        color: #f7f7f7;
      }
    </style>
  </head>
  <body class="min-h-screen bg-[var(--background)] text-[var(--foreground)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
